name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

  

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync with Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Prepare APK File
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: No APK file found in android/app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found compiled APK: $APK_FILE"
          ls -lh "$APK_FILE"
          cp "$APK_FILE" ./MyStudy-debug.apk
          echo "APK successfully verified and copied to ./MyStudy-debug.apk"

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyStudy-Android-APK
          path: MyStudy-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK Attached
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: MyStudy v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## MyStudy Personal Android App — Build #${{ github.run_number }}

            A functional, offline-first personal study and interactive quiz Android app.

            ### Features:
            - **Google Drive-Style Folders**: Biology, Chemistry, and Physics nested chapter folders
            - **Interactive Quiz Runner**: Secure sandboxed runner for Claude AI interactive HTML quizzes
            - **Offline-First Storage**: All folders, quizzes, and theme preferences persist locally
            - **Backup & Restore**: Full library export and restore

            ### How to Install on Your Android Phone:
            1. Download `MyStudy-debug.apk` directly from the **Assets** below onto your Android phone.
            2. Tap the downloaded file in your browser or phone file manager.
            3. If prompted, toggle **"Allow from this source"** in Android Settings.
            4. Tap **Install** and enjoy studying offline!
          files: MyStudy-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
