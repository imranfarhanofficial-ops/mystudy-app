name: Create Signing Key (run once)

on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signing key
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -storetype PKCS12 -keystore mystudy.p12 -alias mystudy -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -dname "CN=MyStudy, O=MyStudy, C=IN"
          base64 -w 0 mystudy.p12 > KEYSTORE_BASE64.txt
          echo "$PASS" > KEYSTORE_PASSWORD.txt

      - name: Save key files
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            KEYSTORE_BASE64.txt
            KEYSTORE_PASSWORD.txt
          retention-days: 1
