<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle Leaf Pattern Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="6" opacity="0.15" />
  
  <!-- Icon Center: Leaf Emblem -->
  <g transform="translate(256, 200)">
    <!-- Right bigger leaf -->
    <path d="M 0,40 C 30,-30 110,-90 120,-30 C 130,30 60,80 0,40 Z" fill="url(#leafGrad)" />
    <!-- Left smaller leaf -->
    <path d="M 0,40 C -30,0 -80,-30 -80,10 C -80,50 -40,60 0,40 Z" fill="url(#leafGrad2)" />
    <!-- Stem -->
    <path d="M 0,40 C 0,70 10,95 20,110" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- Text Brand -->
  <text x="180" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#0f2b48" text-anchor="middle">My</text>
  <text x="320" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#0d9488" text-anchor="middle">Study</text>
</svg>
